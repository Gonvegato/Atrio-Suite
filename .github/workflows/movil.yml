name: Ronrón (móvil)
on:
  push:
    paths: ['movil/**', 'herramientas/**', '.github/workflows/movil.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar y probar
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleRelease assembleDebug 2>&1 | tee build.log
      - name: Errores
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|Exception|FAILED|Caused by|Unresolved|expected|AssertionError" build.log | head -45 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ronron-apk
          path: movil/app/build/outputs/apk/release/app-release.apk
      # Por si la versión optimizada diera algún problema: la de siempre, también firmada con la misma clave.
      - uses: actions/upload-artifact@v4
        with:
          name: ronron-apk-depuracion
          path: movil/app/build/outputs/apk/debug/app-debug.apk
